<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f5f2ec; --ink:#141414; --muted:#7a746c; --line:#e4ded4; --card:#fff; --accent:#6b8c78; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--ink); font-family:'Noto Sans KR',system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  .wrap { max-width:480px; margin:0 auto; padding:40px 16px 48px; }
  header { text-align:center; margin-bottom:28px; }
  header img { height:26px; }
  header p { margin-top:12px; font-size:14px; color:var(--muted); letter-spacing:.02em; }
  .label { font-size:11px; letter-spacing:.24em; color:var(--accent); font-weight:500; margin:0 4px 12px; }
  .card { display:block; background:var(--card); border-radius:22px; overflow:hidden; text-decoration:none; color:inherit;
          box-shadow:0 1px 0 var(--line), 0 10px 30px -18px rgba(0,0,0,.25); margin-bottom:18px; transition:transform .15s; }
  .card:active { transform:scale(.985); }
  .card img { width:100%; aspect-ratio:1/1; object-fit:cover; display:block; background:#eee; }
  .info { padding:16px 18px 18px; }
  .tag { font-size:11px; letter-spacing:.18em; color:var(--muted); }
  .name { font-size:19px; font-weight:700; margin-top:4px; }
  .desc { font-size:14px; color:var(--muted); margin-top:4px; }
  .btn { margin-top:14px; display:flex; align-items:center; justify-content:center; height:48px; border-radius:999px;
         background:var(--ink); color:#fff; font-size:15px; font-weight:500; }
  .links { margin-top:26px; display:grid; gap:10px; }
  .links a { display:flex; align-items:center; justify-content:center; height:52px; border-radius:16px; border:1px solid var(--line);
             background:var(--card); color:var(--ink); text-decoration:none; font-size:15px; font-weight:500; }
  footer { text-align:center; margin-top:28px; font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="img/logo.png" alt="LEJUNEV">
    <p>릴스에 나온 가방, 여기서 바로 보세요</p>
  </header>

  <div class="label">NEW IN REELS</div>

    <div class="info">

      <div class="name">조쿨백팩</div>
      <div class="desc">가볍게 메는 미니 백팩, 230g · 4가지 컬러</div>
      <div class="btn">구매하러 가기 →</div>
    </div>
  </a>

  <a class="card" href="https://le-junev.com/product/detail.html?product_no=1174">
    <img src="img/peanuts_mans_crossbag.jpg" alt="피너츠맨즈크로스백" loading="lazy">
    <div class="info">
      <div class="tag">PEANUTS</div>
      <div class="name">피너츠맨즈크로스백</div>
      <div class="desc">넉넉한 데일리 크로스백 · 4가지 컬러</div>
      <div class="btn">구매하러 가기 →</div>
    </div>
  </a>

  <div class="links">
    <a href="https://le-junev.com/product/list.html?cate_no=74">전체 가방 보기</a>
    <a href="https://ig.me/m/junevk_kyj_">도매·입점 문의 (인스타 DM)</a>
  </div>

  <footer>LEJUNEV · le-junev.com</footer>
</div>
</body>
</html>
